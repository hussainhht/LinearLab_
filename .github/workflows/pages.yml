name: Deploy to GitHub Pages

on:
  push:
    branches: [linerarlap-learning]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          # Ensure GitHub Pages doesn't run Jekyll
          mkdir -p web
          touch web/.nojekyll

          # Create a root index.html that redirects to temp/index.html
          # This keeps all relative links and asset paths working inside temp/
          cat > web/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=temp/index.html">
            <title>Redirecting…</title>
            <link rel="canonical" href="temp/index.html" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <script>
              // Fallback redirect if meta refresh is blocked
              window.location.replace('temp/index.html');
            </script>
          </head>
          <body>
            Redirecting to <a href="temp/index.html">temp/index.html</a>…
          </body>
          </html>
          EOF

          # Ensure assets are available relative to temp/*.html
          if [ -d "web/style" ]; then
            mkdir -p web/temp
            cp -r web/style web/temp/
          fi
          if [ -d "web/js" ]; then
            mkdir -p web/temp
            cp -r web/js web/temp/
          fi
          if [ -d "web/data" ]; then
            mkdir -p web/temp
            cp -r web/data web/temp/
          fi

      - name: Upload artifact (web/)
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the entire web directory so CSS/JS/data are included
          path: "web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
